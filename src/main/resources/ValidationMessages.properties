samplingPlan.planCode.required=must not be blank.
samplingPlan.stationId.required=must not be blank.
samplingPlan.stationId.invalid=must be a UUID in canonical format.
samplingPlan.samplingWindow.required=is required.
samplingPlan.startDate.required=must not be blank.
samplingPlan.endDate.required=must not be blank.
samplingPlan.samplingWindow.iso=must contain valid ISO 8601 dates in yyyy-MM-dd format.
samplingPlan.samplingWindow.order=startDate must not be after endDate.
samplingPlan.sampleVolume.required=is required.
samplingPlan.quantity.required=is required.
samplingPlan.quantity.positive=must be greater than zero.
samplingPlan.quantity.max=must not exceed the maximum 32-bit integer value.
samplingPlan.unit.required=must not be blank.
samplingPlan.priorityLevel.required=is required.
samplingPlan.priorityLevel.min=must be at least 1.
samplingPlan.priorityLevel.max=must be at most 5.
samplingPlan.status.invalid=must be PENDING, APPROVED, COMPLETED, or CANCELLED.
